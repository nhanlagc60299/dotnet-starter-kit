# fullstackhero — production compose for Dokploy.
#
# Nothing here publishes a host port. Dokploy's Traefik routes each domain to a
# container over the external `dokploy-network`; postgres/valkey/migrator live
# only on the project's private default network.
#
# Deploy: see README.md in this directory. Variables come from the Dokploy
# Environment tab (see .env.example); there is no container_name and no
# top-level `name:` because Dokploy sets the compose project name itself.

# Same module switches for the migrator and the API: a module that is on for one
# and off for the other would migrate a schema nobody serves, or the reverse.
# Identity and Multitenancy are required and ignore the switch.
x-modules: &modules
  Modules__Billing__Enabled: ${FSH_MODULE_BILLING:-false}
  Modules__Catalog__Enabled: ${FSH_MODULE_CATALOG:-false}
  Modules__Tickets__Enabled: ${FSH_MODULE_TICKETS:-false}
  Modules__Chat__Enabled: ${FSH_MODULE_CHAT:-false}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsh
      POSTGRES_USER: fsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # The 18+ images keep PGDATA in a versioned subdirectory and refuse to start
      # with a mount at the old /var/lib/postgresql/data, even on an empty volume.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsh -d fsh"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No ports: only the other services of this project reach the database.

  # One-shot, runs on every deploy before the migrator: creates / refreshes the three database
  # roles, extensions and base grants as the bootstrap superuser (fsh). Idempotent, so it also
  # covers an existing volume and password rotation, which Postgres' first-boot-only
  # /docker-entrypoint-initdb.d would not. The scripts are bind-mounted from the repo checkout,
  # which Dokploy has just cloned when `compose up` runs.
  db-roles: &db-roles
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: fsh
      PGUSER: fsh
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD:?APP_MIGRATE_PASSWORD is required}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD is required}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?APP_READONLY_PASSWORD is required}
    volumes:
      - ./postgres-init:/work/postgres-init:ro
      - ./scripts:/work/scripts:ro
    entrypoint: ["sh", "/work/scripts/db-roles.sh"]

  # Same script again, after the migrator and before the API: grants on schemas and tables that
  # the migrator created during THIS deploy (a new module's schema), which the first pass
  # could not see yet.
  db-grants:
    <<: *db-roles
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }

  # Daily pg_dump (as app_readonly) to an S3-compatible bucket (Cloudflare R2) and a monthly proof
  # that the newest dump restores, both from busybox crond. Always on: backups are not optional,
  # so a missing BACKUP_S3_* variable fails the deploy instead of silently skipping them.
  # Never deletes remote objects; retention is the bucket's lifecycle rule (README, "Backup").
  backup:
    build:
      context: ./db-backup
    image: fsh/backup:local
    restart: unless-stopped
    # crond is PID 1 and does not reap children: without an init the throwaway postgres of
    # restore-verify would stay behind as a zombie after every run.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      db-roles: { condition: service_completed_successfully }
    environment:
      PGHOST: postgres
      PGDATABASE: fsh
      PGUSER: app_readonly
      PGPASSWORD: ${APP_READONLY_PASSWORD}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required (backups are mandatory)}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required (backups are mandatory)}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY is required (backups are mandatory)}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY is required (backups are mandatory)}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-fsh}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RESTORE_VERIFY_CRON: ${RESTORE_VERIFY_CRON:-0 4 1 * *}
      RESTORE_VERIFY_MAX_AGE_HOURS: ${RESTORE_VERIFY_MAX_AGE_HOURS:-72}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESTORE_VERIFY_PING_URL: ${RESTORE_VERIFY_PING_URL:-}
    volumes:
      # Scratch space for dumps and the throwaway restore cluster. Declared so the base image's
      # anonymous VOLUME does not leak a new volume on every redeploy.
      - backup_work:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD PING | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot, always runs before the API: fails the deploy unless object storage is S3 and fully
  # configured. The `local` provider is refused on purpose: it serves everything under wwwroot
  # (including private/) to anonymous callers through UseStaticFiles, so it is dev-only
  # (.agents/rules/storage.md). Also catches "bundled RustFS selected but its profile is off".
  init:
    image: alpine:3.20
    restart: "no"
    environment:
      FSH_STORAGE_PROVIDER: ${FSH_STORAGE_PROVIDER:-s3}
      FSH_S3_PUBLIC_URL: ${FSH_S3_PUBLIC_URL:-}
      FSH_S3_SERVICE_URL: ${FSH_S3_SERVICE_URL:-http://rustfs:9000}
      FSH_S3_PUBLIC_BASE_URL: ${FSH_S3_PUBLIC_BASE_URL:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    command:
      - sh
      - -ec
      - |
        provider=$$(echo "$$FSH_STORAGE_PROVIDER" | tr 'A-Z' 'a-z')
        [ "$$provider" = "s3" ] ||
          { echo "FSH_STORAGE_PROVIDER must be s3 (got '$$FSH_STORAGE_PROVIDER'): the local provider exposes private files publicly. See deploy/dokploy/README.md, 'Lưu file'."; exit 1; }
        case "$$FSH_S3_PUBLIC_URL" in
          http://*|https://*) ;;
          *) echo "FSH_S3_PUBLIC_URL is required (an http(s) URL): the public endpoint of the S3 store"; exit 1 ;;
        esac
        case "$$FSH_S3_SERVICE_URL" in
          http://*|https://*) ;;
          *) echo "FSH_S3_SERVICE_URL must be an http(s) URL"; exit 1 ;;
        esac
        case "$$FSH_S3_PUBLIC_BASE_URL" in
          ""|http://*|https://*) ;;
          *) echo "FSH_S3_PUBLIC_BASE_URL must be an http(s) URL"; exit 1 ;;
        esac
        [ -n "$$RUSTFS_ACCESS_KEY" ] && [ -n "$$RUSTFS_SECRET_KEY" ] ||
          { echo "RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY are required (the S3 credentials, for RustFS or an external store)"; exit 1; }
        case "$$FSH_S3_SERVICE_URL" in
          http://rustfs|http://rustfs:*|http://rustfs/*)
            case ",$$COMPOSE_PROFILES," in
              *,storage,*) ;;
              *) echo "FSH_S3_SERVICE_URL points at the bundled RustFS but COMPOSE_PROFILES does not include 'storage'. Set COMPOSE_PROFILES=storage, or point FSH_S3_SERVICE_URL at an external S3/R2 endpoint."; exit 1 ;;
            esac ;;
        esac

  # Profile `storage` only: refuses to start RustFS with blank credentials. RustFS falls back
  # to its well-known default keys when they are empty, and this store is publicly routed.
  storage-guard:
    image: alpine:3.20
    restart: "no"
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
    command:
      - sh
      - -ec
      - |
        [ -n "$$RUSTFS_ACCESS_KEY" ] && [ -n "$$RUSTFS_SECRET_KEY" ] ||
          { echo "profile storage requires RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY (non-empty)"; exit 1; }

  # Profile `storage`: S3-compatible object store (RustFS), the default file store
  # (COMPOSE_PROFILES=storage in .env.example). Leave the profile off only when
  # FSH_S3_SERVICE_URL points at an external S3/R2 bucket. It joins dokploy-network
  # because browsers upload to it directly through presigned URLs.
  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    profiles: [storage]
    depends_on:
      storage-guard: { condition: service_completed_successfully }
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_CONSOLE_ENABLE: "false"
      # The admin and dashboard PUT uploads cross-origin to presigned URLs on this store.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FSH_ADMIN_URL},${FSH_DASHBOARD_URL}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [default, dokploy-network]

  # One-shot: create the bucket and open public/* to anonymous reads (same policy
  # as deploy/docker). Re-applied on every deploy.
  rustfs-init:
    image: amazon/aws-cli:2.37.3
    restart: "no"
    profiles: [storage]
    depends_on:
      storage-guard: { condition: service_completed_successfully }
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ${FSH_S3_BUCKET:-fsh} 2>/dev/null ||
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ${FSH_S3_BUCKET:-fsh}
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket ${FSH_S3_BUCKET:-fsh} --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${FSH_S3_BUCKET:-fsh}/public/*"]}]}'

  # One-shot: applies EF migrations and seeds on every deploy, before the API starts.
  migrator:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/fsh-db-migrator:${FSH_IMAGE_TAG:-latest}
    # Dokploy runs `up -d --build` without --pull: without this a redeploy keeps the cached image
    # even when a mutable tag (dev-latest, latest) has moved.
    pull_policy: always
    restart: "no"
    depends_on:
      db-roles: { condition: service_completed_successfully }
      valkey:   { condition: service_healthy }
    environment:
      <<: *modules
      DOTNET_ENVIRONMENT: Production
      # Connection as the DDL role (app_migrate). The chiseled image has no libgssapi_krb5,
      # so keep `GSS Encryption Mode=Disable` in the string.
      DatabaseOptions__ConnectionString: Host=postgres;Database=fsh;Username=app_migrate;Password=${APP_MIGRATE_PASSWORD};GSS Encryption Mode=Disable
      CachingOptions__Redis: valkey,password=${REDIS_PASSWORD}
      JwtOptions__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
    command: ["apply", "--seed"]

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/fsh-api:${FSH_IMAGE_TAG:-latest}
    pull_policy: always   # see migrator
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      valkey:   { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
      init:     { condition: service_completed_successfully }
      db-grants: { condition: service_completed_successfully }
      # Bucket exists before the API starts; ignored when the storage profile is off (external S3).
      rustfs-init: { condition: service_completed_successfully, required: false }
    environment:
      <<: *modules
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Connection as the runtime role (app_runtime): DML only, no DDL.
      DatabaseOptions__ConnectionString: Host=postgres;Database=fsh;Username=app_runtime;Password=${APP_RUNTIME_PASSWORD};GSS Encryption Mode=Disable
      CachingOptions__Redis: valkey,password=${REDIS_PASSWORD}
      JwtOptions__SigningKey: ${JWT_SIGNING_KEY}
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD}
      # Always s3: `init` refuses anything else (the local provider serves private/ anonymously).
      Storage__Provider: ${FSH_STORAGE_PROVIDER:-s3}
      # What the API itself calls: the bundled RustFS by default, or an external S3/R2 endpoint.
      Storage__S3__ServiceUrl: ${FSH_S3_SERVICE_URL:-http://rustfs:9000}
      # Presigned URLs go to browsers, which cannot resolve rustfs:9000: the public endpoint.
      Storage__S3__PresignServiceUrl: ${FSH_S3_PUBLIC_URL:-}
      # Base of public file URLs. Default fits RustFS (path-style: <public url>/<bucket>); an
      # external bucket serving files from its own domain (R2 custom domain) sets it explicitly.
      Storage__S3__PublicBaseUrl: ${FSH_S3_PUBLIC_BASE_URL:-${FSH_S3_PUBLIC_URL:-}/${FSH_S3_BUCKET:-fsh}}
      Storage__S3__AccessKey: ${RUSTFS_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${RUSTFS_SECRET_KEY:-}
      Storage__S3__Bucket: ${FSH_S3_BUCKET:-fsh}
      Storage__S3__ForcePathStyle: "true"
      # No bundled mail catcher in production: point these at a real SMTP provider.
      MailOptions__Smtp__Host: ${FSH_SMTP_HOST:-}
      MailOptions__Smtp__Port: ${FSH_SMTP_PORT:-587}
      MailOptions__Smtp__Security: ${FSH_SMTP_SECURITY:-StartTls}
      MailOptions__Smtp__UserName: ${FSH_SMTP_USERNAME:-}
      MailOptions__Smtp__Password: ${FSH_SMTP_PASSWORD:-}
      MailOptions__From: ${FSH_MAIL_FROM:-}
      AllowedHosts: "*"
      HangfireOptions__UserName: ${HANGFIRE_USERNAME:?HANGFIRE_USERNAME is required}
      HangfireOptions__Password: ${HANGFIRE_PASSWORD:?HANGFIRE_PASSWORD is required}
      CorsOptions__AllowedOrigins__0: ${FSH_ADMIN_URL:?FSH_ADMIN_URL is required}
      CorsOptions__AllowedOrigins__1: ${FSH_DASHBOARD_URL:?FSH_DASHBOARD_URL is required}
      # E-mail-link origins. Separate list from CORS: the API origin must stay off it.
      FrontendOptions__AllowedOrigins__0: ${FSH_ADMIN_URL}
      FrontendOptions__AllowedOrigins__1: ${FSH_DASHBOARD_URL}
      FrontendOptions__DefaultOrigin: ${FSH_DASHBOARD_URL}
      OpenTelemetryOptions__Exporter__Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Dokploy domain -> service `api`, port 8080.
    networks: [default, dokploy-network]

  # admin/dashboard have no registry image yet, so Dokploy builds them from the repo.
  admin:
    build:
      context: ../../clients/admin
    image: fsh/admin:local
    restart: unless-stopped
    depends_on:
      migrator: { condition: service_completed_successfully }
    environment:
      FSH_API_URL: ${FSH_API_URL:?FSH_API_URL is required}
      FSH_DASHBOARD_URL: ${FSH_DASHBOARD_URL:?FSH_DASHBOARD_URL is required}
      FSH_DEFAULT_TENANT: ${FSH_DEFAULT_TENANT:-root}
    # Dokploy domain -> service `admin`, port 80.
    networks: [default, dokploy-network]

  dashboard:
    build:
      context: ../../clients/dashboard
    image: fsh/dashboard:local
    restart: unless-stopped
    depends_on:
      migrator: { condition: service_completed_successfully }
    environment:
      FSH_API_URL: ${FSH_API_URL}
      FSH_DEFAULT_TENANT: ${FSH_DEFAULT_TENANT:-root}
    # Dokploy domain -> service `dashboard`, port 80.
    networks: [default, dokploy-network]

networks:
  dokploy-network:
    external: true

volumes:
  pg_data:
  valkey_data:
  rustfs_data:
  backup_work:
