# Nested engine settings.
[engine]
# No systemd inside the runner container.
cgroup_manager = "cgroupfs"
events_logger = "file"
# See crun-ci: strips oomScoreAdj, which the nested engine may not lower.
runtime = "crun-ci"

[engine.runtimes]
crun-ci = ["/usr/local/bin/crun-ci"]

[network]
# The host engine already uses 10.88.0.0/16 (and 10.89.x for its networks) and the runner container
# sits on it; nested bridges on the same range would not route.
default_subnet = "10.210.0.0/16"
default_subnet_pools = [{ "base" = "10.211.0.0/16", "size" = 24 }]
